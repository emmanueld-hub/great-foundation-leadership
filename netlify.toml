[build]
  command = "rm -rf _site && mkdir _site && unzip -q great-foundation-mobile-hero-icon-fix.zip -d _site && cp *.html overrides.css portrait-fix.js site.webmanifest _redirects _site/ && for f in _site/*.html; do sed -i 's#</head>#<script src=\"/portrait-fix.js\" defer></script></head>#' \"$f\"; done"
  publish = "_site"
