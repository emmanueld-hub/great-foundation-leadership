[build]
  command = "rm -rf _site && mkdir _site && unzip -q great-foundation-mobile-hero-icon-fix.zip -d _site && mkdir -p _site/images && cp *.html overrides.css portrait.css site.webmanifest _redirects _site/ && cp images/emmanuel-s-desmolieres.jpg _site/images/ && for f in _site/*.html; do sed -i 's#</head>#<link rel=\"stylesheet\" href=\"/portrait.css\"></head>#' \"$f\"; done"
  publish = "_site"
