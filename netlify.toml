[build]
  command = "rm -rf _site && mkdir _site && unzip -q great-foundation-mobile-hero-icon-fix.zip -d _site && mkdir -p _site/images && cp *.html overrides.css portrait.css site.webmanifest _redirects _site/ && cp images/gf-bold-browser-icon.png images/gf-bold-iphone-icon.png _site/images/ && for f in _site/*.html; do sed -i 's#/images/favicon-32x32.png#/images/gf-bold-browser-icon.png#g; s#/images/favicon-16x16.png#/images/gf-bold-browser-icon.png#g; s#/images/apple-touch-icon.png#/images/gf-bold-iphone-icon.png#g; s#/site.webmanifest#/site.webmanifest?v=2#g' \"$f\"; done"
  publish = "_site"
