[build]
  command = "rm -rf _site && mkdir _site && unzip -q great-foundation-mobile-hero-icon-fix.zip -d _site && mkdir -p _site/images && cp *.html overrides.css portrait.css site.webmanifest _redirects _site/ && cp images/apple-touch-icon.png images/favicon-16x16.png images/favicon-32x32.png _site/images/"
  publish = "_site"
