# Legal footer links deployment
[build]
  command = "rm -rf _site && mkdir _site && unzip -q great-foundation-mobile-hero-icon-fix.zip -d _site && mkdir -p _site/images && cp *.html overrides.css portrait.css program-logos.css site.webmanifest _redirects _site/ && cp images/gf-icon-v4-16.png images/gf-icon-v4-32.png images/gf-icon-v4-180.png images/greatreaders-program-logo.svg images/finsmarts-logo-v3.svg images/ai-literacy-logo-v3.svg _site/images/ && for f in _site/*.html; do sed -i 's#</head>#<link rel=\"stylesheet\" href=\"/program-logos.css\" /></head>#; s#<div class=\"round-icon\"><span class=\"icon-letter\">GR</span></div>#<img class=\"program-brand-logo\" src=\"/images/greatreaders-program-logo.svg\" alt=\"GreatReaders Academy logo\">#g; s#<div class=\"round-icon\"><span class=\"icon-letter\">FS</span></div>#<img class=\"program-brand-logo\" src=\"/images/finsmarts-logo-v3.svg\" alt=\"FinSmarts Academy logo\">#g; s#<div class=\"round-icon\"><span class=\"icon-letter\">AI</span></div>#<img class=\"program-brand-logo\" src=\"/images/ai-literacy-logo-v3.svg\" alt=\"AI Literacy logo\">#g; s#<h3>GreatReaders</h3>##g; s#<h3>FinSmarts</h3>##g; s#<h3>AI Literacy</h3>##g; s#<h2>GreatReaders</h2>##g; s#<h2>FinSmarts</h2>##g; s#<h2>AI Literacy</h2>##g; s#Sugar Land, Texas#Houston, Texas#g; s#</footer>#<div style=\"text-align:center;padding:0 20px 22px;color:#c6d0dd;font-size:11px\"><a href=\"/privacy.html\" style=\"color:#c6d0dd;text-decoration:none\">Privacy Policy</a><span style=\"margin:0 10px\">|</span><a href=\"/terms.html\" style=\"color:#c6d0dd;text-decoration:none\">Terms / Disclaimer</a></div></footer>#g; s#/images/favicon-32x32.png#/images/gf-icon-v4-32.png#g; s#/images/favicon-16x16.png#/images/gf-icon-v4-16.png#g; s#/images/apple-touch-icon.png#/images/gf-icon-v4-180.png#g; s#/images/gf-bold-browser-icon.png#/images/gf-icon-v4-32.png#g; s#/images/gf-bold-iphone-icon.png#/images/gf-icon-v4-180.png#g; s#/site.webmanifest[^\" ]*#/site.webmanifest?v=4#g' \"$f\"; done"
  publish = "_site"
